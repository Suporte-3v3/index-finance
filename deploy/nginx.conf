# Copie este arquivo para /etc/nginx/sites-available/idex-finance
# e crie o link simbólico em sites-enabled (ver runbook de deploy).
#
# Fase 1 (sem domínio): use como está, escutando na porta 80 pelo IP.
# Fase 2 (com domínio): troque "server_name _;" pelo domínio e rode
# certbot --nginx, que edita este arquivo automaticamente para HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
